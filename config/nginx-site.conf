# ============================================================
# FileBrowser 网盘反向代理（实际使用配置）
# 部署位置：/etc/nginx/sites-available/pan
# 启用：ln -s /etc/nginx/sites-available/pan /etc/nginx/sites-enabled/pan
# 对外端口 8081；回源 8085(FileBrowser) 与 8086(fbproxy 登录过滤器)
# 注意：若配置改动需 nginx -t && systemctl reload nginx
# ============================================================
server {
    listen 8081;
    server_name _;

    # 允许大文件上传 / 下载，关闭代理缓冲
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;

    # 登录接口：先经空格过滤器去掉首尾空格（转发到 fbproxy 8086）
    location = /api/login {
        proxy_pass http://127.0.0.1:8086;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # FB_CUSTOM_ZH：强制简体中文（替代前端 i18n 语言探测，见 docs/03）
    location = /static/assets/i18n-C0UlxgXD.js {
        alias /srv/fb-custom/i18n-C0UlxgXD.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }

    # 其余全部走 FileBrowser（8085）
    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
