# ============================================================
# 网盘反向代理(实际使用配置,2026-09-06 起回源 frp 隧道)
# 部署位置:/etc/nginx/sites-available/pan
# 启用:ln -s /etc/nginx/sites-available/pan /etc/nginx/sites-enabled/pan
# 对外端口 8081;本机回源 8087(frps 数据口,经隧道连本地 Windows FileBrowser)
# 历史:迁移前 FileBrowser 跑在 47 本机 8085(Docker),fbproxy 转发目标同步改为 8087
# 注意:若配置改动需 nginx -t && systemctl reload nginx
# ============================================================
server {
    listen 8081;
    server_name _;

    # 允许大文件上传 / 下载,关闭代理缓冲
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;

    # 登录接口:先经空格过滤器去掉首尾空格(转发到 fbproxy 8086)
    location = /api/login {
        proxy_pass http://127.0.0.1:8086;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # FB_CUSTOM_ZH:强制简体中文(替代前端 i18n 语言探测,见 docs/03)
    # 补丁文件仍在 47 本地,FileBrowser(本地 Windows)版本保持 2.63.23 时文件名 hash 一致
    location = /static/assets/i18n-C0UlxgXD.js {
        alias /srv/fb-custom/i18n-C0UlxgXD.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }

    # 其余全部走 frp 数据口(8087):nginx -> frps -> 隧道 -> 本地 FileBrowser
    location / {
        proxy_pass http://127.0.0.1:8087;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
